<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- 背景 -->
  <rect x="0" y="0" width="400" height="300" fill="#F7F5F0" />
  
  <!-- 远山 -->
  <path d="M 0 250 Q 80 180 150 260 T 400 250 L 400 300 L 0 300 Z" fill="#3E5C76" fill-opacity="0.05" />
  
  <!-- 祥云 -->
  <path d="M 40 70 Q 55 50 70 70 Q 85 50 100 70 Q 110 85 90 90 L 50 90 Q 30 85 40 70 Z" fill="#3E5C76" fill-opacity="0.08" />
  
  <!-- 梅枝 -->
  <path d="M 20 280 Q 50 230 100 250 M 70 250 Q 90 220 130 230 M 40 260 Q 70 240 90 260" fill="none" stroke="#3E5C76" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- 梅花点缀 -->
  <circle cx="100" cy="250" r="4" fill="#B83B43" />
  <circle cx="80" cy="235" r="3" fill="#B83B43" />
  <circle cx="115" cy="240" r="2.5" fill="#B83B43" />
  
  <!-- 墨月 -->
  <circle cx="320" cy="60" r="25" fill="#3E5C76" fill-opacity="0.1" />
  
  <!-- 勾股定理图形 -->
  <!-- 三角形 -->
  <path d="M 210 180 L 210 120 L 130 180 Z" fill="#F7F5F0" stroke="#3E5C76" stroke-width="2" stroke-linejoin="round" />
  <!-- 直角符号 -->
  <path d="M 200 180 L 200 170 L 210 170" fill="none" stroke="#3E5C76" stroke-width="1.5" />
  
  <!-- 勾方 -->
  <path d="M 210 180 L 210 120 L 270 120 L 270 180 Z" fill="#3E5C76" fill-opacity="0.08" stroke="#3E5C76" stroke-width="1" stroke-dasharray="4 4" />
  <!-- 股方 -->
  <path d="M 210 180 L 130 180 L 130 260 L 210 260 Z" fill="#3E5C76" fill-opacity="0.08" stroke="#3E5C76" stroke-width="1" stroke-dasharray="4 4" />
  <!-- 弦方 -->
  <path d="M 210 120 L 130 180 L 190 260 L 270 200 Z" fill="#3E5C76" fill-opacity="0.08" stroke="#3E5C76" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- 面积标签 -->
  <text x="240" y="155" font-family="'KaiTi', 'STKaiti', serif" font-size="16" fill="#3E5C76" text-anchor="middle">a²</text>
  <text x="170" y="225" font-family="'KaiTi', 'STKaiti', serif" font-size="16" fill="#3E5C76" text-anchor="middle">b²</text>
  <text x="200" y="195" font-family="'KaiTi', 'STKaiti', serif" font-size="16" fill="#3E5C76" text-anchor="middle">c²</text>
  
  <!-- 标题和公式 -->
  <text x="200" y="45" font-family="'KaiTi', 'STKaiti', serif" font-size="28" font-weight="bold" fill="#3E5C76" text-anchor="middle">勾股定理</text>
  <text x="200" y="80" font-family="'KaiTi', 'STKaiti', serif" font-size="20" fill="#B83B43" text-anchor="middle">a² + b² = c²</text>
  
  <!-- 印章 -->
  <rect x="310" y="260" width="50" height="25" rx="3" fill="none" stroke="#B83B43" stroke-width="2" />
  <text x="335" y="278" font-family="'KaiTi', 'STKaiti', serif" font-size="14" fill="#B83B43" text-anchor="middle" font-weight="bold">无字</text>
</svg>