<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- 背景色 -->
  <rect width="400" height="300" fill="#F7F5F0" />

  <!-- 外框装饰 -->
  <rect x="15" y="15" width="370" height="270" fill="none" stroke="#3E5C76" stroke-width="1.5" opacity="0.4" rx="4" />

  <!-- 水墨山水（远景） -->
  <path d="M 0 230 Q 40 180 90 210 T 180 220 T 260 190 T 350 230 L 400 260 L 400 300 L 0 300 Z" fill="#3E5C76" opacity="0.08" />
  
  <!-- 水墨山水（近景） -->
  <path d="M 0 260 Q 60 220 120 250 T 220 240 T 320 230 T 400 260 L 400 300 L 0 300 Z" fill="#3E5C76" opacity="0.12" />

  <!-- 飞鸟（左上点缀） -->
  <path d="M 20 40 Q 35 20 50 35 Q 65 20 80 40 Q 65 30 50 40 Q 35 30 20 40 Z" fill="#3E5C76" opacity="0.6" />

  <!-- 梅花枝干（右下） -->
  <path d="M 370 285 Q 375 200 395 150 M 385 220 Q 355 190 335 180 M 395 150 Q 400 140 395 135" fill="none" stroke="#B83B43" stroke-width="2.5" stroke-linecap="round" />

  <!-- 梅花花朵（朱砂点） -->
  <path d="M 395 135 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0 M 370 185 a 3.5 3.5 0 1 0 7 0 a 3.5 3.5 0 1 0 -7 0 M 380 205 a 3 3 0 1 0 6 0 a 3 3 0 1 0 -6 0 M 350 185 a 3 3 0 1 0 6 0 a 3 3 0 1 0 -6 0 M 340 180 a 2.5 2.5 0 1 0 5 0 a 2.5 2.5 0 1 0 -5 0" fill="#B83B43" />

  <!-- 数学图形：长方形 -->
  <rect x="65" y="95" width="160" height="110" fill="none" stroke="#3E5C76" stroke-width="3" />

  <!-- 长度标注线 -->
  <path d="M 65 220 L 225 220 M 235 95 L 235 205" fill="none" stroke="#3E5C76" stroke-width="1.5" />
  
  <!-- 标注端点（小斜线） -->
  <path d="M 60 215 L 70 225 M 220 215 L 230 225 M 230 90 L 240 100 M 230 200 L 240 210" fill="none" stroke="#3E5C76" stroke-width="1.5" />

  <!-- 标注文字 -->
  <text x="145" y="245" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#3E5C76" text-anchor="middle" font-style="italic">a</text>
  <text x="260" y="155" font-family="KaiTi, STKaiti, serif" font-size="22" fill="#3E5C76" text-anchor="middle" font-style="italic">b</text>

  <!-- 标题（古风右对齐） -->
  <text x="370" y="55" font-family="KaiTi, STKaiti, serif" font-size="24" fill="#3E5C76" text-anchor="end" font-weight="bold">长方形面积计算</text>

  <!-- 核心公式（朱砂色） -->
  <text x="370" y="95" font-family="KaiTi, STKaiti, serif" font-size="28" fill="#B83B43" text-anchor="end" font-style="italic">S = a × b</text>

  <!-- 印章点缀（左上） -->
  <rect x="370" y="125" width="28" height="28" fill="none" stroke="#B83B43" stroke-width="1.5" rx="2" />
  <text x="384" y="145" font-family="KaiTi, STKaiti, serif" font-size="14" fill="#B83B43" text-anchor="middle">面</text>
</svg>