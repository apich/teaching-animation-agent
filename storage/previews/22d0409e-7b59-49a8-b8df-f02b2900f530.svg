<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- 背景色：宣纸色 -->
  <rect width="400" height="300" fill="#F7F5F0" />
  
  <!-- 远山与流水意象（黛蓝） -->
  <path d="M 0 280 Q 80 240 180 270 T 400 290 L 400 300 L 0 300 Z" fill="#3E5C76" opacity="0.08" />
  <circle cx="300" cy="80" r="40" fill="#3E5C76" opacity="0.05" />
  
  <!-- 梅花枝干（黛蓝） -->
  <path d="M 30 100 C 20 70, 40 40, 70 30 C 90 20, 110 30, 120 50" fill="none" stroke="#3E5C76" stroke-width="3" stroke-linecap="round" />
  
  <!-- 梅花花朵与花苞（朱砂） -->
  <circle cx="70" cy="30" r="5" fill="#B83B43" />
  <circle cx="90" cy="25" r="4" fill="#B83B43" />
  <circle cx="110" cy="35" r="6" fill="#B83B43" />
  <circle cx="40" cy="50" r="4" fill="#B83B43" />
  <circle cx="85" cy="20" r="2.5" fill="#B83B43" />
  <circle cx="115" cy="45" r="2" fill="#B83B43" />
  
  <!-- 核心算式：3 × 4 = 12 -->
  <text x="225" y="90" font-family="'STKaiti', 'KaiTi', 'SimSun', serif" font-size="48" font-weight="bold" fill="#3E5C76" text-anchor="end">3 × 4</text>
  <text x="235" y="90" font-family="'STKaiti', 'KaiTi', 'SimSun', serif" font-size="48" font-weight="bold" fill="#B83B43" text-anchor="start">= 12</text>
  
  <!-- 3×4 点阵网格图（黛蓝） -->
  <path d="M 125 160 L 245 160 M 125 200 L 245 200 M 125 240 L 245 240" stroke="#3E5C76" stroke-width="10" stroke-linecap="round" stroke-dasharray="0, 40" />
  <rect x="105" y="140" width="160" height="120" fill="none" stroke="#3E5C76" stroke-width="1" opacity="0.6" />
  
  <!-- 图解分组标识：4个一组（朱砂） -->
  <rect x="105" y="140" width="160" height="40" fill="none" stroke="#B83B43" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- 三个花括号表示3组（朱砂） -->
  <path d="M 100 152 Q 90 160 100 168" fill="none" stroke="#B83B43" stroke-width="2" stroke-linecap="round" />
  <path d="M 100 192 Q 90 200 100 208" fill="none" stroke="#B83B43" stroke-width="2" stroke-linecap="round" />
  <path d="M 100 232 Q 90 240 100 248" fill="none" stroke="#B83B43" stroke-width="2" stroke-linecap="round" />
  
  <!-- 底部朱砂点缀，表示答案的完整性 -->
  <circle cx="185" cy="280" r="4" fill="#B83B43" opacity="0.6" />
</svg>